<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO Title & Description -->

<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="manifest" href="images/site.webmanifest">

    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #0b0e17 url("/images/account-background.svg") center / cover fixed; color: #f8fafc; }
        main { width: 100%; max-width: 440px; padding: 28px; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; background: rgba(19, 24, 38, .88); backdrop-filter: blur(12px); }
        a { color: #93c5fd; }
        h1 { margin: 0 0 8px; font-size: 26px; }
        p { color: #94a3b8; line-height: 1.5; }
        form { display: grid; gap: 12px; margin-top: 20px; }
        label { color: #cbd5e1; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; background: rgba(11, 14, 23, .72); color: #f8fafc; font: inherit; }
        button { padding: 13px; border: 0; border-radius: 8px; background: #3b82f6; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #accountMessage { min-height: 22px; margin-top: 14px; font-size: 14px; }
    </style>
</head>
<body>
    <main>
    
        <h1 style="margin-top: 24px;">Create your account</h1>
        <form id="accountForm" data-action="register">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="password">Password (8–128 characters)</label>
            <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
            <button type="submit">Create account</button>
        </form>
        <p id="accountMessage" aria-live="polite"></p>
        <p>Already have an account? <a id="switchAccountLink" href="/login.html">Sign in</a></p>
    </main>
    <script src="account.js"></script>
</body>
</html>
