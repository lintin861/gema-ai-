    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #0b0e17 url("/images/account-background.svg") center / cover fixed; color: #f8fafc; }
        main { width: 100%; max-width: 440px; text-align: center; }
        h1 { margin-bottom: 12px; font-size: 30px; }
        .gema-wave {
  font-size: 60px;
  font-weight: 800;
  letter-spacing: 3px;
}

.gema-wave span {
  display: inline-block;
  animation:
    waveBounce 1.6s ease-in-out infinite,
    hueShift 4s linear infinite;
  color: #38bdf8;
}

.gema-wave span:nth-child(1) { animation-delay: 0.0s; }
.gema-wave span:nth-child(2) { animation-delay: 0.1s; }
.gema-wave span:nth-child(3) { animation-delay: 0.2s; }
.gema-wave span:nth-child(4) { animation-delay: 0.3s; }
.gema-wave span:nth-child(6) { animation-delay: 0.4s; }
.gema-wave span:nth-child(7) { animation-delay: 0.5s; }

@keyframes waveBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes hueShift {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}
        p { color: #94a3b8; line-height: 1.6; }
        .actions { display: grid; gap: 12px; margin: 28px 0 18px; }
        /* Button Container Style */
.btn-primary, .btn-outline, .auth-btn {
  position: relative;
  padding: 14px 28px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  border: 2px solid transparent;
  background: linear-gradient(135deg, #1e293b, #0f172a);
  color: #38bdf8;
  text-transform: uppercase;
  letter-spacing: 1px;
  
  /* Smooth glowing animation loop */
  animation: buttonGlow 3s ease-in-out infinite alternate;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
}

/* Glowing text color shift and text shadow */
.btn-primary span, .btn-outline span, .auth-btn {
  animation: textGlow 3s ease-in-out infinite alternate;
}

/* Hover effect for extra punch */
.btn-primary:hover, .btn-outline:hover, .auth-btn:hover {
  transform: translateY(-3px);
  animation: buttonFastGlow 1.5s ease-in-out infinite alternate;
}

/* Keyframes for Box Glow & Border Color Cycling */
@keyframes buttonGlow {
  0% {
    border-color: #38bdf8;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.2);
  }
  33% {
    border-color: #818cf8;
    box-shadow: 0 0 15px rgba(129, 140, 248, 0.5), inset 0 0 12px rgba(129, 140, 248, 0.2);
  }
  66% {
    border-color: #c084fc;
    box-shadow: 0 0 15px rgba(192, 132, 252, 0.5), inset 0 0 12px rgba(192, 132, 252, 0.2);
  }
  100% {
    border-color: #f472b6;
    box-shadow: 0 0 10px rgba(244, 114, 182, 0.4), inset 0 0 10px rgba(244, 114, 182, 0.2);
  }
}

/* Keyframes for Text Color & Text Glow */
@keyframes textGlow {
  0% {
    color: #38bdf8;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
  }
  33% {
    color: #818cf8;
    text-shadow: 0 0 8px rgba(129, 140, 248, 0.8), 0 0 20px rgba(129, 140, 248, 0.4);
  }
  66% {
    color: #c084fc;
    text-shadow: 0 0 8px rgba(192, 132, 252, 0.8), 0 0 20px rgba(192, 132, 252, 0.4);
  }
  100% {
    color: #f472b6;
    text-shadow: 0 0 8px rgba(244, 114, 182, 0.8), 0 0 20px rgba(244, 114, 182, 0.4);
  }
}

@keyframes buttonFastGlow {
  0% {
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.8), 0 0 30px rgba(56, 189, 248, 0.5);
  }
  100% {
    box-shadow: 0 0 25px rgba(244, 114, 182, 0.9), 0 0 40px rgba(244, 114, 182, 0.6);
  }
}
        .plans-link { display: inline-block; margin-top: 20px; color: #93c5fd; }
